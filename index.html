<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYACHENKO-PERSONALITY</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='50' font-family='Arial, Helvetica, sans-serif' font-size='62' font-weight='900' fill='%23000000' text-anchor='middle' dominant-baseline='central' letter-spacing='-1'%3EDY%3C/text%3E%3C/svg%3E">
    
    <!-- Подключаем шрифт Unbounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unbounded', 'Helvetica Neue', Arial, sans-serif;
            position: relative;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes letterDropIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translate(var(--start-x), var(--start-y)) scale(0.9); }
            100% { opacity: 1; transform: translate(var(--end-x), var(--end-y)) scale(1); }
        }

        @keyframes colorShift {
            0%   { background-color: var(--color-1); }
            33%  { background-color: var(--color-2); }
            66%  { background-color: var(--color-3); }
            100% { background-color: var(--color-1); }
        }

        .glow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; filter: blur(80px); 
        }

        .glow-blob {
            position: absolute; border-radius: 50%; opacity: 0;
            animation: slideIn 1.5s ease-out forwards, colorShift 8s linear infinite;
        }

        /* Свечения */
        .glow-teal {
            top: 50%; left: 0; width: 50vw; height: 50vw;
            --color-1: rgba(0, 206, 209, 0.6); --color-2: rgba(30, 144, 255, 0.6); --color-3: rgba(50, 205, 50, 0.6);
            --start-x: -150vw; --start-y: -50%; --end-x: -50%; --end-y: -50%;
        }
        .glow-purple {
            top: 0; left: 30%; width: 50vw; height: 50vw;
            --color-1: rgba(138, 43, 226, 0.5); --color-2: rgba(255, 105, 180, 0.5); --color-3: rgba(0, 191, 255, 0.5);
            --start-x: -50%; --start-y: -150vh; --end-x: -50%; --end-y: -50%;
        }
        .glow-pink {
            top: 70%; right: 0; width: 50vw; height: 50vw;
            --color-1: rgba(255, 20, 147, 0.5); --color-2: rgba(255, 140, 0, 0.5); --color-3: rgba(138, 43, 226, 0.5);
            --start-x: 150vw; --start-y: -50%; --end-x: 50%; --end-y: -50%;
        }
        .glow-amber {
            bottom: 0; right: 30%; width: 50vw; height: 50vw;
            --color-1: rgba(255, 191, 0, 0.5); --color-2: rgba(255, 69, 0, 0.5); --color-3: rgba(255, 255, 0, 0.5);
            --start-x: 50%; --start-y: 150vh; --end-x: 50%; --end-y: 50%;
        }
        .glow-green {
            bottom: 0; left: 20%; width: 40vw; height: 40vw;
            --color-1: rgba(0, 255, 127, 0.4); --color-2: rgba(0, 206, 209, 0.4); --color-3: rgba(152, 251, 152, 0.4);
            --start-x: -150vw; --start-y: 150vh; --end-x: -50%; --end-y: 50%;
        }
        .glow-blue {
            top: 0; right: 0; width: 45vw; height: 45vw;
            --color-1: rgba(0, 150, 255, 0.5); --color-2: rgba(75, 0, 130, 0.5); --color-3: rgba(230, 230, 250, 0.5);
            --start-x: 150vw; --start-y: -150vh; --end-x: 30%; --end-y: -30%;
        }

        .center-mask {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.9) 30%, rgba(255,255,255,0) 60%);
            z-index: 0;
        }

        /* ========================================= */
        /* ТЕКСТ                                     */
        /* ========================================= */
        
        .text-container {
            z-index: 1;
            position: relative; 
            display: flex;
            align-items: baseline;
            
            /* Включаем аппаратное ускорение для плавности */
            will-change: transform, filter, opacity;
            transform: translateZ(0); 
            
            animation: 
                shrinkAndShift 0.6s ease-in-out 1.6s forwards,
                flyAway 1.5s cubic-bezier(0.8, 0, 1, 1) 3.45s forwards;
        }

        @keyframes shrinkAndShift {
            0% { transform: scale(1) translateX(0); }
            100% { transform: scale(0.6) translateX(-17vw); }
        }

        /* Оптимизированная анимация улета */
        @keyframes flyAway {
            0% {
                transform: scale(0.6) translateX(-17vw) translateY(0);
                filter: blur(0px);
                opacity: 1;
            }
            60% {
                transform: scale(0.6) translateX(-17vw) translateY(-20vh);
                filter: blur(2px);
                opacity: 1;
            }
            100% {
                transform: scale(0.6) translateX(-17vw) translateY(-120vh);
                /* Уменьшили блюр для меньшей нагрузки */
                filter: blur(10px);
                /* Текст исчезает чуть раньше, чтобы не рендерить "мусор" */
                opacity: 0; 
            }
        }

        h1 {
            font-size: clamp(1.5rem, 8vw, 6.5rem); 
            font-weight: 700;
            letter-spacing: 0.05em; 
            color: #000000;
            padding: 0 0 0 1rem;
            display: flex;
            margin: 0;
        }

        .char {
            display: inline-block;
            opacity: 0;
            animation: letterDropIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Задержки для PERSONALITY */
        h1 .char:nth-child(1)  { animation-delay: 0.50s; }
        h1 .char:nth-child(2)  { animation-delay: 0.55s; }
        h1 .char:nth-child(3)  { animation-delay: 0.60s; }
        h1 .char:nth-child(4)  { animation-delay: 0.65s; }
        h1 .char:nth-child(5)  { animation-delay: 0.70s; }
        h1 .char:nth-child(6)  { animation-delay: 0.75s; }
        h1 .char:nth-child(7)  { animation-delay: 0.80s; }
        h1 .char:nth-child(8)  { animation-delay: 0.85s; }
        h1 .char:nth-child(9)  { animation-delay: 0.90s; }
        h1 .char:nth-child(10) { animation-delay: 0.95s; }
        h1 .char:nth-child(11) { animation-delay: 1.00s; }

        /* Контейнер для .project */
        .project-text {
            position: absolute; 
            left: 100%; 
            display: flex;
            align-items: baseline;
            font-size: clamp(1.5rem, 8vw, 6.5rem); 
            font-weight: 700; 
            letter-spacing: 0.05em; 
            color: #000000;
            white-space: nowrap;
            margin-left: -0.2em; 
        }

        /* Задержки для .project */
        .project-text .char:nth-child(1) { animation-delay: 2.4s; }
        .project-text .char:nth-child(2) { animation-delay: 2.45s; }
        .project-text .char:nth-child(3) { animation-delay: 2.50s; }
        .project-text .char:nth-child(4) { animation-delay: 2.55s; }
        .project-text .char:nth-child(5) { animation-delay: 2.60s; }
        .project-text .char:nth-child(6) { animation-delay: 2.65s; }
        .project-text .char:nth-child(7) { animation-delay: 2.70s; }
        .project-text .char:nth-child(8) { animation-delay: 2.75s; }

        /* --- ЗАДЕРЖКИ ДЛЯ СВЕЧЕНИЙ --- */
        .glow-green  { animation-delay: 1.1s, 0s; }
        .glow-blue   { animation-delay: 1.2s, 0s; }
        .glow-teal   { animation-delay: 1.3s, 0s; }
        .glow-amber  { animation-delay: 1.4s, 0s; }
        .glow-purple { animation-delay: 1.5s, 0s; }
        .glow-pink   { animation-delay: 1.6s, 0s; }
        
    </style>
</head>
<body>
    <div class="glow-container">
        <div class="glow-blob glow-teal"></div>
        <div class="glow-blob glow-purple"></div>
        <div class="glow-blob glow-pink"></div>
        <div class="glow-blob glow-amber"></div>
        <div class="glow-blob glow-green"></div>
        <div class="glow-blob glow-blue"></div>
        <div class="center-mask"></div>
    </div>

    <div class="text-container">
        <h1>
            <span class="char">P</span><span class="char">E</span><span class="char">R</span><span class="char">S</span><span class="char">O</span><span class="char">N</span><span class="char">A</span><span class="char">L</span><span class="char">I</span><span class="char">T</span><span class="char">Y</span>
        </h1>
        
        <div class="project-text">
            <span class="char">.</span><span class="char">p</span><span class="char">r</span><span class="char">o</span><span class="char">j</span><span class="char">e</span><span class="char">c</span><span class="char">t</span>
        </div>
    </div>
</body>
</html>
